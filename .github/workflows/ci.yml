name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Fast feedback: typecheck, tests, smoke on every push/PR
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:native-sqlite
      - run: pnpm validate:pet
      - run: bash scripts/smoke.sh
      - run: bash scripts/mobile-smoke.sh

  # Desktop publish gate: build + live xvfb session on Ubuntu
  desktop-publish-ubuntu:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: pnpm --dir apps/electron exec electron-builder install-app-deps
      - run: pnpm --filter ./apps/electron run build:linux
      - run: |
          mkdir -p /tmp/better-sqlite3-build/build/Release
          cd /tmp/better-sqlite3-build
          npm init -y >/dev/null 2>&1
          npm install better-sqlite3@11.10.0 >/dev/null 2>&1
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node build/Release/better_sqlite3.node
          node -e "const D=require('/tmp/better-sqlite3-build/build/Release/better_sqlite3.node'); console.log('node-ABI better-sqlite3 fallback ready')" 
      - run: bash scripts/e2e-electron.sh
      - run: test -n "$(find apps/electron/build -maxdepth 1 -name '*.AppImage' -print -quit)"
      - run: test -n "$(find apps/electron/build -maxdepth 1 -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-unpacked-ubuntu
          path: apps/electron/build/linux-unpacked/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-installers
          path: |
            apps/electron/build/*.AppImage
            apps/electron/build/*.deb
          retention-days: 7

  # Desktop publish gate: Windows NSIS build
  desktop-publish-windows:
    runs-on: windows-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: pnpm --dir apps/electron exec electron-builder install-app-deps
      - run: pnpm --filter ./apps/electron run build:win
      - shell: pwsh
        run: ./scripts/verify-windows-nsis.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsis-windows
          path: apps/electron/build/*.exe
          retention-days: 7

  # Desktop publish gate: macOS DMG build
  desktop-publish-macos:
    runs-on: macos-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: pnpm --dir apps/electron exec electron-builder install-app-deps
      - run: iconutil -c icns apps/electron/assets/icon.iconset -o apps/electron/assets/icon.icns
      - run: pnpm --filter ./apps/electron run build:mac
      - run: bash scripts/verify-macos-dmg.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-macos
          path: apps/electron/build/*.dmg
          retention-days: 7

  # Mobile: build Android APK locally from the Expo Android prebuild
  mobile-preview:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: npm install -g eas-cli
      - run: eas login
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
      - run: bash scripts/verify-eas-identity.sh
      - run: bash scripts/export-mobile-standalone.sh
      - run: |
          cd /tmp/smart-pet-agent-mobile
          npm install --legacy-peer-deps --ignore-scripts
          npx expo prebuild --platform android --clean
          cp -r android "$GITHUB_WORKSPACE/apps/mobile/android"
        env:
          CI: true
      - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk
      - run: cd apps/mobile/android && ./gradlew assembleDebug
      - run: bash scripts/verify-android-apk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # Mobile publish gate: signed Android App Bundle + Play Internal Track.
  # This intentionally runs only when explicitly dispatched with store secrets configured.
  mobile-android-play-internal:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: npm install -g eas-cli
      - run: eas login
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
      - run: bash scripts/verify-eas-identity.sh
      - run: |
          test -n "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}"
          printf '%s' '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > apps/mobile/service-account-key.json
      - run: eas build --platform android --profile production --non-interactive --wait
        working-directory: apps/mobile
      - run: eas submit --platform android --profile production --non-interactive
        working-directory: apps/mobile
