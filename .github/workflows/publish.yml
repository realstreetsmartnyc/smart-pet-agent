name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-cli:
    name: Publish @smart-pet/cli to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Use packageManager from package.json (pnpm@9.4.0) — no explicit version
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Verify secrets
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          echo "NPM_TOKEN is set"

      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      - run: pnpm --filter @smart-pet/core run build
      - run: pnpm --filter @smart-pet/cli run build

      - name: Verify build artifacts
        run: |
          test -f apps/cli/dist/index.cjs
          test -f apps/cli/package.json

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        working-directory: apps/cli
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_NAME" != "" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "Version mismatch: package=$VERSION tag=$TAG_VERSION"
              exit 1
            fi
          fi
          # Patch workspace dep
          node -e "
            const fs=require('fs');
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            if(p.dependencies&&p.dependencies['@smart-pet/core']){
              p.dependencies['@smart-pet/core']='^'+p.dependencies['@smart-pet/core'].replace('workspace:','');
            }
            fs.writeFileSync('package.json',JSON.stringify(p,null,2));
          "
          npm publish --access public --provenance

  release-check:
    name: Check GitHub release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists"
          else
            echo "Release not found - create with: gh release create $GITHUB_REF_NAME"
          fi
