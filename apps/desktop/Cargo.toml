[package]
name = "smart-pet-desktop"
version = "0.1.0"
description = "Smart Pet Agent Desktop — Street Smart NYC ambient companion"
license = "MIT"
edition = "2024"

[lib]
name = "smart_pet_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "notification-all"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
