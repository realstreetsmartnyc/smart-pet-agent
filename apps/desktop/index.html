<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Pet Agent</title>
  <link rel="stylesheet" href="/tokens.css" />
  <style>
    :root {
      --ink-950:#0b0d10; --asphalt-900:#14181d; --asphalt-800:#1b2128;
      --steel-700:#41505f; --steel-500:#6f8093; --tile-100:#f2efe8;
      --taxi-500:#f4b400; --signal-500:#ff8a1f; --civic-500:#2f80ed;
      --alert-500:#d64545; --success-500:#2da56a;
      --mono:"SFMono-Regular","JetBrains Mono",monospace;
      --sans:"Segoe UI","Aptos","Helvetica Neue",sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--sans);background:transparent;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:var(--tile-100)}
    #pet-container{position:relative;width:120px;height:120px;cursor:pointer;transition:transform 160ms ease}
    #pet{width:67px;height:67px;border-radius:50%;background:radial-gradient(circle at 30% 30%, rgba(242,239,232,0.96), rgba(65,80,95,0.42) 38%, rgba(20,24,29,0.92) 74%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.28), inset -3px -4px 10px rgba(0,0,0,0.36), 0 10px 24px rgba(0,0,0,0.26), 0 0 0 1px rgba(255,255,255,0.08), 0 0 18px rgba(244,180,0,0.10);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);animation:breathe 3s ease-in-out infinite;border:1px solid rgba(255,255,255,0.08)}
    @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.015)}}
    #pet.happy{box-shadow:inset 0 1px 0 rgba(255,255,255,0.28), inset -3px -4px 10px rgba(0,0,0,0.32), 0 10px 24px rgba(0,0,0,0.26), 0 0 0 1px rgba(45,165,106,0.22), 0 0 18px rgba(45,165,106,0.28)}
    #pet.excited{box-shadow:inset 0 1px 0 rgba(255,255,255,0.30), 0 10px 24px rgba(0,0,0,0.26), 0 0 0 1px rgba(244,180,0,0.20), 0 0 22px rgba(255,138,31,0.26)}
    .eye{position:absolute;width:12px;height:14px;background:var(--tile-100);border-radius:50%;top:22px;overflow:hidden;transition:all 160ms ease}
    .eye.left{left:16px}.eye.right{right:16px}.eye::after{content:'';position:absolute;width:6px;height:6px;background:var(--ink-950);border-radius:50%;top:4px;left:3px}
    .eye.blink{height:2px;top:28px}
    .mouth{position:absolute;width:16px;height:8px;border-bottom:2px solid rgba(242,239,232,0.88);border-radius:0 0 50% 50%;bottom:18px;left:50%;transform:translateX(-50%);transition:all 160ms ease}
    #chat-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:360px;max-width:90vw;background:linear-gradient(180deg, rgba(20,24,29,0.96), rgba(11,13,16,0.98));border:1px solid rgba(255,255,255,0.10);backdrop-filter:blur(16px);border-radius:18px;box-shadow:0 12px 28px rgba(0,0,0,0.32);display:none;flex-direction:column;max-height:400px;z-index:100}
    #chat-container.open{display:flex}
    #chat-header{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;color:var(--tile-100)}
    #chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
    .message{padding:8px 12px;border-radius:12px;max-width:85%;font-size:13px;line-height:1.45;border:1px solid rgba(255,255,255,0.08)}
    .message.user{align-self:flex-end;background:linear-gradient(135deg, rgba(244,180,0,0.92), rgba(255,138,31,0.90));color:#17120a;border-bottom-right-radius:4px}
    .message.agent{align-self:flex-start;background:rgba(255,255,255,0.06);color:var(--tile-100);border-bottom-left-radius:4px}
    #chat-input-container{display:flex;padding:8px;border-top:1px solid rgba(255,255,255,0.08);gap:8px}
    #chat-input{flex:1;border:1px solid rgba(255,255,255,0.10);border-radius:20px;padding:8px 14px;font-size:13px;outline:none;background:rgba(255,255,255,0.04);color:var(--tile-100)}
    #chat-send{background:linear-gradient(135deg, var(--taxi-500), var(--signal-500));color:#1a1306;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer}
    #status-bar{position:fixed;top:8px;right:8px;display:flex;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:rgba(242,239,232,0.62)}
  </style>
</head>
<body>
  <div id="status-bar"><span id="mood-indicator">idle</span><span>·</span><span id="energy-indicator">100%</span><span id="tauri-badge" style="color:var(--taxi-500)">Smart Pet Agent</span></div>
  <div id="pet-container" title="Smart Pet Agent — Street Smart NYC companion">
    <div id="pet"><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div></div>
  </div>
  <div id="chat-container">
    <div id="chat-header"><span style="display:flex;align-items:center;gap:8px"><span style="width:7px;height:7px;border-radius:999px;background:var(--taxi-500);box-shadow:0 0 10px rgba(244,180,0,0.4)"></span>Smart Pet Agent</span><button onclick="toggleChat()" style="border:none;background:none;cursor:pointer;color:var(--tile-100);font-size:16px">✕</button></div>
    <div id="chat-messages"></div>
    <div id="chat-input-container"><input type="text" id="chat-input" placeholder="Ask Smart Pet Agent..." onkeydown="if(event.key==='Enter')sendMessage()" /><button id="chat-send" onclick="sendMessage()">↗</button></div>
  </div>
  <script>
    const isTauri = typeof window.__TAURI__ !== 'undefined';
    let currentMood='idle';
    const pet=document.getElementById('pet'), petContainer=document.getElementById('pet-container'), chatContainer=document.getElementById('chat-container'), chatMessages=document.getElementById('chat-messages'), chatInput=document.getElementById('chat-input');
    petContainer.addEventListener('click', toggleChat);
    setInterval(()=>{ document.querySelectorAll('.eye').forEach(e=>e.classList.add('blink')); setTimeout(()=>document.querySelectorAll('.eye').forEach(e=>e.classList.remove('blink')),140)}, 3200);
    function toggleChat(){ chatContainer.classList.toggle('open'); if(chatContainer.classList.contains('open')) chatInput.focus(); }
    async function sendMessage(){
      const text=chatInput.value.trim(); if(!text) return;
      const u=document.createElement('div'); u.className='message user'; u.textContent=text; chatMessages.appendChild(u); chatInput.value='';
      try{
        let data;
        if(isTauri){
          const { invoke } = window.__TAURI__.core;
          data = await invoke('agent_speak', { input: text });
          data = typeof data==='string' ? { text: data } : data;
        } else {
          const r=await fetch('http://localhost:3000/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:text})});
          data=await r.json();
        }
        const a=document.createElement('div'); a.className='message agent'; a.textContent=data.text||'Thinking...'; chatMessages.appendChild(a);
        chatMessages.scrollTop=chatMessages.scrollHeight;
      } catch{ const e=document.createElement('div'); e.className='message agent'; e.textContent='Smart Pet Agent runtime not yet connected.'; chatMessages.appendChild(e); }
    }
    document.getElementById('mood-indicator').textContent=currentMood;
  </script>
</body>
</html>
