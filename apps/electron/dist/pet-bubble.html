<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Pet Agent — Bubble</title>
  <link rel="stylesheet" href="./tokens.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent !important; overflow: hidden; font-family: var(--sans); }
    .bubble-root { position: fixed; inset: 0; display: flex; align-items: flex-end; padding: 0 0 4px 8px; pointer-events: none; }
    .bubble {
      display: inline-block; max-width: 118px; max-height: 110px; overflow: hidden;
      background: linear-gradient(180deg, rgba(20,24,29,0.96), rgba(11,13,16,0.98));
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px 14px 14px 4px; padding: 8px 9px 8px; position: relative;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.06);
      pointer-events: none; animation: bubbleIn 0.26s cubic-bezier(0.16,1,0.3,1);
    }
    .bubble::before {
      content:""; position:absolute; top:0; left:0; right:0; height:3px;
      background: linear-gradient(90deg, var(--taxi-500), var(--signal-500));
      opacity:.95;
    }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .bubble-tail { position: absolute; bottom: -7px; left: 12px; width: 12px; height: 8px; background: rgba(11,13,16,0.98); clip-path: polygon(0 0, 100% 0, 0 100%); }
    .bubble-text { font-size: 11px; color: var(--tile-100); line-height: 1.45; word-wrap: break-word; margin-top: 4px; }
    .bubble-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; margin-top: 3px; flex-shrink: 0; }
    .bubble-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: var(--mono); font-size: 9.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent;
    }
    .bubble-chip-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }
    .bubble-chip.done { background: rgba(45,165,106,0.14); color: var(--success-500); border-color: rgba(45,165,106,0.22); }
    .bubble-chip.done .bubble-chip-dot { background: var(--success-500); }
    .bubble-chip.running { background: rgba(47,128,237,0.12); color: var(--civic-500); border-color: rgba(47,128,237,0.22); animation: chipPulse 1.4s ease-in-out infinite; }
    .bubble-chip.running .bubble-chip-dot { background: var(--civic-500); animation: dotPulse 1.2s ease-in-out infinite; }
    .bubble-chip.listening { background: rgba(255,138,31,0.12); color: var(--signal-500); border-color: rgba(255,138,31,0.22); }
    .bubble-chip.listening .bubble-chip-dot { background: var(--signal-500); }
    @keyframes chipPulse { 0%,100%{opacity:1} 50%{opacity:.62} }
    @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:.34} }
    .bubble-dots { display:flex; gap:3px; padding:2px 0; }
    .bubble-dots span { width:4px; height:4px; background: rgba(242,239,232,0.52); border-radius:50%; animation: dotBounce 1.4s ease-in-out infinite; }
    .bubble-dots span:nth-child(2){animation-delay:.14s} .bubble-dots span:nth-child(3){animation-delay:.28s}
    @keyframes dotBounce { 0%,80%,100%{transform:scale(.62);opacity:.34} 40%{transform:scale(1);opacity:1} }
  </style>
</head>
<body>
  <div class="bubble-root" id="bubbleRoot">
    <div class="bubble" id="bubble" style="display:none;">
      <div class="bubble-tools" id="bubbleTools"></div>
      <div class="bubble-text" id="bubbleText"></div>
      <div class="bubble-tail"></div>
    </div>
  </div>

  <script>
    const electronAPI = window.electronAPI || {};
    const bubble = document.getElementById('bubble');
    const bubbleText = document.getElementById('bubbleText');
    const bubbleTools = document.getElementById('bubbleTools');
    let hideTimer = null;
    function showBubble() { bubble.style.display='block'; if(hideTimer) clearTimeout(hideTimer); }
    function hideBubble() { bubble.style.display='none'; }
    function setBubbleText(text) { bubbleText.textContent=text; showBubble(); }
    function addToolChip(name, phase) {
      const existing = document.querySelector(`.bubble-chip[data-name="${name}"]`);
      if (existing) { existing.className=`bubble-chip ${phase}`; return; }
      const chip=document.createElement('div'); chip.className=`bubble-chip ${phase}`; chip.dataset.name=name;
      const dot=document.createElement('span'); dot.className='bubble-chip-dot'; chip.appendChild(dot);
      chip.appendChild(document.createTextNode(name)); bubbleTools.appendChild(chip); showBubble();
    }
    if (electronAPI) {
      electronAPI.onAIRunStart && electronAPI.onAIRunStart(()=>{ bubbleTools.innerHTML=''; bubbleText.textContent=''; showBubble(); });
      electronAPI.onAIChunk && electronAPI.onAIChunk((chunk)=>{ bubbleText.textContent += chunk; showBubble(); });
      electronAPI.onAITool && electronAPI.onAITool((data)=>{ addToolChip(data.name||'Tool', data.phase||'running'); if(data.phase==='done') addToolChip(data.name||'Tool','done'); });
      electronAPI.onAIDone && electronAPI.onAIDone(()=>{ hideTimer=setTimeout(hideBubble,7000); });
      electronAPI.onAIFinal && electronAPI.onAIFinal((data)=>{ if(data?.content){ bubbleText.textContent=data.content; showBubble(); } });
      electronAPI.onRuntimeEvent && electronAPI.onRuntimeEvent((e)=>{
        if(e.event==='pet.intent' && e.payload?.animation){
          if(e.payload.animation==='listening') addToolChip('Listening','listening');
          if(e.payload.animation==='thinking') addToolChip('Thinking','running');
          if(e.payload.animation==='task-loop') addToolChip('Working','running');
        }
        if(e.event==='chat.chunk' && e.payload?.text) { bubbleText.textContent += e.payload.text; showBubble(); }
        if(e.event==='chat.done') hideTimer=setTimeout(hideBubble,7000);
      });
    }
  </script>
</body>
</html>
