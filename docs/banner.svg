<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d10"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- map lines -->
  <path d="M0 420 Q 320 380 640 420 T 1280 410" stroke="#1e3a5f" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M0 480 Q 400 460 700 500 T 1280 470" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.35"/>
  <!-- glow -->
  <circle cx="1050" cy="180" r="180" fill="#f59e0b" opacity="0.08"/>
  <circle cx="200" cy="520" r="120" fill="#3b82f6" opacity="0.1"/>
  <!-- icon -->
  <rect x="80" y="80" width="96" height="96" rx="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="128" y="145" text-anchor="middle" font-family="monospace" font-size="52" fill="#fbbf24">◈</text>
  <!-- title -->
  <text x="220" y="145" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#f8fafc">Smart Pet Agent</text>
  <text x="220" y="185" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#94a3b8">Ambient AI companion — local-first, ever-evolving</text>
  <!-- pill -->
  <rect x="220" y="210" width="220" height="32" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="330" y="231" text-anchor="middle" font-family="monospace" font-size="13" fill="#94a3b8">DESKTOP • CLI • TUI • MOBILE</text>
  <!-- tagline -->
  <text x="80" y="320" font-family="system-ui, sans-serif" font-size="22" fill="#e2e8f0">Free &amp; open-source. Your AI OS companion</text>
  <text x="80" y="350" font-family="system-ui, sans-serif" font-size="22" fill="#e2e8f0">that thinks, learns, acts, and grows.</text>
  <text x="80" y="395" font-family="monospace" font-size="14" fill="#64748b">MIT • Street Smart NYC • No telemetry • No ads • No cloud required</text>
  <!-- signal dots -->
  <circle cx="80" cy="530" r="6" fill="#f59e0b" opacity="0.9"/><circle cx="100" cy="530" r="6" fill="#3b82f6" opacity="0.7"/><circle cx="120" cy="530" r="6" fill="#ef4444" opacity="0.6"/>
  <text x="140" y="535" font-family="monospace" font-size="12" fill="#475569">NYC • LOCAL-FIRST • OPERATOR-OWNED</text>
  <text x="1100" y="600" font-family="monospace" font-size="11" fill="#334155">streetsmartnyc.cloud</text>
</svg>