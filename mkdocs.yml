site_name: Smart Pet Agent
site_description: Free, open-source, ever-evolving AI OS companion — Street Smart NYC desktop pet agent.
site_author: Street Smart NYC
repo_url: https://github.com/realstreetsmartnyc/smart-pet-agent
repo_name: realstreetsmartnyc/smart-pet-agent
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - toc:
      permalink: true
  - attr_list
  - def_list
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Providers:
    - Overview: providers.md
    - LLM Providers: llm-providers.md
  - Pets & Templates:
    - Overview: PETS.md
    - Templates: templates.md
    - Custom Pet Spec: CUSTOM_PET_SPEC.md
  - FAQ: faq.md
  - Guides:
    - Onboarding: ONBOARDING.md
    - Trust & Permissions: TRUST.md
    - Mobile Trust: MOBILE_TRUST.md
    - Architecture: architecture.md
    - Contributing: contributing.md
  - Reference:
    - Release Checklist: RELEASE_CHECKLIST.md
    - Changelog: changelog.md
